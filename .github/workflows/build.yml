name: Build LinkSwitch

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      # A tag build writes the tag's version into Info.plist.
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          make VERSION="${GITHUB_REF_NAME#v}"
        else
          make
        fi

    - name: Test
      run: make test

    - name: Zip Application
      run: cd build && zip -r ../LinkSwitch.zip LinkSwitch.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinkSwitch.app
        path: LinkSwitch.zip

  # The only job that can write to the repository; it runs no code from it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: LinkSwitch.app

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: LinkSwitch.zip
        generate_release_notes: true

    - name: Update Homebrew Formula
      uses: mislav/bump-homebrew-formula-action@v3
      with:
        formula-name: linkswitch
        formula-path: Casks/linkswitch.rb
        homebrew-tap: kriuchkov/homebrew-tap
        download-url: https://github.com/kriuchkov/linkswitch/releases/download/${{ github.ref_name }}/LinkSwitch.zip
        # With false, v1.1.0 was committed to a new branch of the tap and no pull
        # request was opened, so the cask stayed behind. With true it opens one.
        create-pullrequest: true
      env:
        COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
