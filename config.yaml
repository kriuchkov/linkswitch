# LinkSwitch configuration: ~/.config/linkswitch/config.yaml
# Reference: https://github.com/kriuchkov/linkswitch#configuration

# Buttons in the picker, shown when no rule matches a link.
# Profile names defined below can be listed here too.
browsers:
  - Safari
  - Google Chrome
  - Firefox

# Browsers with extra arguments, or a full command with a {url} placeholder.
profiles:
  # - name: Chrome Work
  #   app: Google Chrome
  #   args: --profile-directory='Profile 1'

# Checked from top to bottom; the first match picks the browser.
rules:
  # - domain: zoom.us            # zoom.us and its subdomains
  #   browser: zoom.us
  # - domain: github.com
  #   browser: Chrome Work
